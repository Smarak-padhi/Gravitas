<!DOCTYPE html>
<html><head><title>Glass Ops</title>
<style>
  body { background: linear-gradient(135deg, #1e3a8a, #0f172a); color: white; font-family: sans-serif; padding: 20px; }
  .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left; }
</style>
</head>
<body>
  <div class="glass-card"><h1>Cluster Operations</h1><p>Translucent telemetry container</p></div>
  <div class="glass-card"><table><tr><th>Node</th><th>Status</th></tr><tr><td>node-01</td><td>Nominal</td></tr></table></div>
</body></html>
