<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Spec Card</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .card { width: 480px; padding: 16px; border: 1px solid #1a1a1a; box-sizing: border-box; }
    .title { font-weight: bold; text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid #1a1a1a; padding-bottom: 8px; margin-bottom: 12px; }
    .row { display: flex; padding: 6px 0; border-bottom: 1px dotted #ccc; }
    .label { width: 40%; color: #666; }
    .value { width: 60%; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">System Specification // Node-01</div>
    <div class="row"><div class="label">Architecture</div><div class="value">x86_64 Cloud Compute</div></div>
    <div class="row"><div class="label">Memory Allocation</div><div class="value">64 GB ECC DDR5</div></div>
    <div class="row"><div class="label">Cluster Status</div><div class="value">Nominal</div></div>
  </div>
</body>
</html>
