<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Material 3 Adaptive Layout</title>
  <style>
    :root { --rail-w: 72px; --bar-h: 80px; --touch-target: 48px; --primary: #1e293b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; height: 100vh; overflow: hidden; display: flex; color: #1e293b; background: #f8fafc; }
    /* Expanded Layout (> 840px) */
    .nav-rail { width: var(--rail-w); background: #f1f5f9; border-right: 1px solid #cbd5e1; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 12px; }
    .nav-item { min-width: var(--touch-target); min-height: var(--touch-target); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; text-decoration: none; color: inherit; border-radius: 8px; }
    .nav-item:hover, .nav-item[aria-current="page"] { background: #e2e8f0; font-weight: 600; }
    .pane-container { flex: 1; display: flex; height: 100%; overflow: hidden; }
    .master-pane { width: 360px; border-right: 1px solid #cbd5e1; overflow-y: auto; padding: 16px; background: #fff; }
    .detail-pane { flex: 1; overflow-y: auto; padding: 24px; background: #f8fafc; }
    /* Medium Layout (600px - 840px) */
    @media (max-width: 840px) and (min-width: 600px) {
      .master-pane { width: 300px; }
    }
    /* Compact Layout (< 600px) */
    @media (max-width: 599px) {
      body { flex-direction: column-reverse; }
      .nav-rail { width: 100%; height: var(--bar-h); border-right: none; border-top: 1px solid #cbd5e1; flex-direction: row; justify-content: space-around; padding: 0; }
      .pane-container { flex-direction: column; }
      .master-pane { width: 100%; height: 100%; border-right: none; }
      .detail-pane { display: none; }
    }
  </style>
</head>
<body>
  <nav class="nav-rail" aria-label="Primary Navigation">
    <a href="#" class="nav-item" aria-current="page">Inbox</a>
    <a href="#" class="nav-item">Sent</a>
    <a href="#" class="nav-item">Starred</a>
  </nav>
  <div class="pane-container">
    <aside class="master-pane" aria-label="Conversation Index">
      <h2>Conversations</h2>
      <p style="margin-top: 8px; font-size: 13px; color: #64748b;">12 active threads</p>
    </aside>
    <main class="detail-pane" aria-label="Active Message Surface">
      <h2>Thread: Q3 Financial Planning</h2>
      <p style="margin-top: 12px; line-height: 1.6;">Detailed message content rendered in supporting pane.</p>
    </main>
  </div>
</body>
</html>
