<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Adaptive App</title>
  <style>
    body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; }
    nav { width: 200px; background: #333; color: white; padding: 16px; }
    main { flex: 1; padding: 20px; overflow-y: auto; }
    @media (max-width: 600px) {
      body { flex-direction: column-reverse; }
      nav { width: 100%; height: 50px; display: flex; justify-content: space-around; padding: 0; }
    }
  </style>
</head>
<body>
  <nav><a href="#">Inbox</a><a href="#">Sent</a><a href="#">Trash</a></nav>
  <main><h2>Message List</h2><p>Select a message to read.</p></main>
</body>
</html>
